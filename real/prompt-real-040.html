    <textarea id="thaiPrompt" rows="8">
สร้างภาพถ่ายแฟชั่นพอร์ตเทรตแนวสมจริงมาก (Ultra-realistic professional photography) ของผู้หญิงวัยทำงานชาวเอเชีย อายุประมาณ 30–35 ปี บุคลิกสวยสง่า ดูเป็นผู้หญิงทำงานมืออาชีพ มีความมั่นใจ อบอุ่น และเป็นมิตร

## ใบหน้าและการแต่งหน้า:

ใบหน้าสวยหวานแบบผู้หญิงเอเชียร่วมสมัย โครงหน้าสมส่วน ดูอ่อนวัย สง่างาม และเป็นธรรมชาติ

แต่งหน้าในสไตล์ **Modern K-Beauty ที่ได้รับแรงบันดาลใจจาก Douyin แบบละเอียดและพอดี** เน้นความสวยใส สุภาพ หรูหรา และเหมาะกับผู้หญิงทำงานมืออาชีพ ไม่แต่งหน้าจัดหรือแฟชั่นจนเกินไป

ดวงตาสีน้ำตาลกลมโต ดูสดใสและมีประกายอย่างเป็นธรรมชาติ อายแชโดว์โทนน้ำตาลอมชมพูและเบจอ่อน ไล่สีอย่างนุ่มนวล มีประกายละเอียดเล็กน้อยบริเวณเปลือกตาเพื่อเพิ่มมิติ ดวงตามี eyeliner เส้นบางคมแต่ไม่เข้มเกินไป และขนตายาวงอนเป็นธรรมชาติ ดูฟุ้งและไม่หนาจนเกินไป

คิ้วทรงธรรมชาติ สีเดียวกับเส้นผม เรียงเส้นสวย ไม่เข้มและไม่หนาเกินไป

บลัชออนโทนชมพูอมพีชอ่อน ปัดบาง ๆ บริเวณพวงแก้มและแตะบริเวณสันจมูกเล็กน้อย ให้แก้มดูมีเลือดฝาดและสุขภาพดีอย่างเป็นธรรมชาติ

จมูกมีมิติอย่างนุ่มนวลด้วย contour ที่บางและเป็นธรรมชาติ ไม่ทำให้สันจมูกดูแข็งหรือคมเกินไป

ริมฝีปากแต่งด้วยลิปโทนนู้ด อมแดง แบบไล่ระดับสี โดยด้านในริมฝีปากมีสีเข้มกว่าด้านนอกเล็กน้อย สีปากดูอิ่ม สดใส และมีชีวิตชีวา ริมฝีปากมีความฉ่ำน้ำแบบ juicy glossy lips เคลือบด้วยความวาวใสเหมือนมีหยดน้ำบาง ๆ บนริมฝีปาก มี natural wet shine และ subtle light reflections ที่ช่วยให้ริมฝีปากดูอวบอิ่มและชุ่มชื้นอย่างเห็นได้ชัด สีปากมีความสดใสแต่ยังดูหรูหรา ไม่เข้มจัด ไม่ซีด และไม่ดูเป็นลิปแมตต์


ผิวขาวอมชมพูแบบ porcelain luminous skin เนียนละเอียด กระจ่างใส ฉ่ำวาวแบบ glass skin อย่างเป็นธรรมชาติ ผิวดูสุขภาพดี นุ่มละมุน และมีความเปล่งประกายอย่างพอดี มี skin texture ที่ละเอียดและสมจริง มองเห็นรายละเอียดผิวตามธรรมชาติอย่าง subtle มีรูขุมขนละเอียดมาก ไม่ทำให้ผิวเรียบจนผิดธรรมชาติ ไม่เป็นผิวพลาสติก และไม่เป็นผิวตุ๊กตา

ภาพรวมของใบหน้าดู **สวยใส หรูหรา อ่อนหวาน สุขภาพดี และมั่นใจ** มีเสน่ห์แบบผู้หญิงยุคใหม่ แต่ยังคงความเป็นมืออาชีพและน่าเชื่อถือ เหมาะกับภาพ Personal Branding และ Corporate Lifestyle Photography

## ทรงผม:

ผมยาวสีน้ำตาลเข้ม ยาวประมาณกลางหลังถึงเอว ผมหนาและมีวอลลุ่ม แสกกลางอย่างเป็นธรรมชาติ ผมด้านหน้าปัดเล็กน้อยและมีปอยผมกรอบใบหน้า ลอนผมอ่อน ๆ แบบธรรมชาติ ผมด้านหนึ่งตกลงมาบริเวณไหล่และหน้าอก เส้นผมมีรายละเอียดสมจริง เงางามอย่างเป็นธรรมชาติ ไม่แข็ง ไม่เป็นก้อน

## เสื้อผ้า:

สวมเสื้อแขนกุดคอสูงสีดำ ทรงเข้ารูปพอดีตัว เนื้อผ้าถักละเอียดแบบ ribbed knit มีเส้น texture แนวตั้งชัดเจน ดูเรียบหรูและเป็นมืออาชีพ

สวมกระโปรงสีขาวครีมทรงดินสอหรือทรงเข้ารูป เอวสูง เนื้อผ้าดูพรีเมียม สะอาด เรียบหรู ความยาวประมาณเข่า มีดีไซน์ผ่าด้านหน้าเล็กน้อยอย่างสุภาพ

สวมสร้อยคอเส้นเล็กสีทองแบบเรียบหรู และต่างหูเม็ดเล็กสีทองหรือสีเงิน

สวมกำไลข้อมือเส้นบาง ดูมินิมอลและมีระดับ

## ท่าทาง:

ผู้หญิงนั่งอยู่บนเก้าอี้สำนักงานสีดำบริเวณโต๊ะทำงาน

ลำตัวหันเข้าหากล้องเล็กน้อย แต่ยังคงท่านั่งที่ดูเป็นธรรมชาติ

ใบหน้าและดวงตาหันมามองกล้องโดยตรง

กำลังใช้งานแล็ปท็อปที่วางอยู่บนโต๊ะด้านหน้า

มือทั้งสองข้างวางอยู่บนแป้นพิมพ์แล็ปท็อปอย่างเป็นธรรมชาติ เหมือนกำลังทำงาน

แขนและมือมีสัดส่วนถูกต้อง นิ้วมือครบถ้วนและสมจริง

ไหล่ผ่อนคลาย ท่านั่งสง่างาม ดูเป็นผู้หญิงทำงานที่มั่นใจ

มีรอยยิ้มอย่างเป็นธรรมชาติ ไม่ยิ้มกว้างจนเกินไป

## สถานที่:

สำนักงานสมัยใหม่ระดับพรีเมียม บรรยากาศอบอุ่น สะอาด และเป็นมืออาชีพ

ด้านหลังเป็นหน้าต่างกระจกบานใหญ่สูงจากพื้นเกือบถึงเพดาน

มองเห็นวิวเมืองแบบเบลอ ๆ อยู่ด้านนอกหน้าต่าง

มีแสงธรรมชาติจากด้านหลังและด้านข้างของตัวแบบ

บริเวณด้านซ้ายของภาพมีต้นไม้กระถางสีเขียววางอยู่บนโต๊ะหรือพื้น

มีโต๊ะทำงานไม้สีอ่อนอยู่ด้านหน้าตัวแบบ

มีแล็ปท็อปสีเข้มวางอยู่บนโต๊ะ

ด้านหลังมีเก้าอี้สำนักงานสีดำขนาดใหญ่

องค์ประกอบสำนักงานดูเรียบหรู ทันสมัย และไม่รก

## แสง:

ใช้แสงธรรมชาติแบบ soft daylight จากหน้าต่างบานใหญ่

แสงอุ่นนุ่ม ๆ คล้ายช่วงเช้าหรือช่วงบ่าย

แสงตกกระทบเส้นผมและขอบตัวแบบอย่างสวยงาม เกิด rim light บาง ๆ บริเวณเส้นผม

ใบหน้าสว่างและมีมิติ แต่ไม่ overexposed

มีเงาอ่อน ๆ บนใบหน้าและเสื้อผ้า

แสงบนผิวมีความนุ่มนวลและเป็นธรรมชาติ ให้ผิวดู luminous และฉ่ำวาวอย่างพอดี ไม่เกิด highlight ที่สว่างหรือมันจนเกินไป

บรรยากาศโดยรวมสว่าง อบอุ่น สะอาด และดูแพง

## การจัดองค์ประกอบภาพ:

ภาพแนวตั้งอัตราส่วน 9:16

จัดตัวแบบให้อยู่บริเวณกึ่งกลางค่อนไปทางขวาของภาพ

ถ่ายตั้งแต่ศีรษะลงมาถึงช่วงต้นขาและเข่า ให้เห็นเสื้อผ้าและท่านั่งอย่างชัดเจน

ตัวแบบอยู่ใน foreground และโดดเด่นจากฉากหลัง

มีโต๊ะและแล็ปท็อปอยู่บริเวณด้านล่างซ้ายของภาพ

เก้าอี้สำนักงานอยู่ด้านหลังทางขวา

หน้าต่างและวิวเมืองเป็นฉากหลัง

จัดองค์ประกอบแบบ lifestyle corporate portrait

มีพื้นที่ด้านบนเล็กน้อย ไม่ตัดศีรษะ

สัดส่วนร่างกายสมจริง ไม่บิดเบี้ยว

## กล้องและคุณภาพ:

Canon EOS R5, เลนส์ 50–70 มม.

f/2.0–f/2.8, shallow natural depth of field, face and hands remain sufficiently sharp

สุนทรียศาสตร์แฟชั่นที่เน้นรายละเอียดอย่างพิถีพิถัน

โฟกัสคมชัดที่ดวงตาและใบหน้า

ฉากหลังละลายแบบ natural bokeh

depth of field ตื้น

รายละเอียดผิว เส้นผม เสื้อผ้า และเครื่องประดับคมชัดสมจริง

photorealistic, ultra detailed, high-end commercial photography, luxury corporate lifestyle photography

โทนสีอบอุ่นแบบ natural beige, cream, black และ brown

dynamic range สูง

รายละเอียดแสงและเงาสมจริง

ภาพสะอาด ไม่มี noise และ grain มากเกินไป

คุณภาพระดับภาพถ่ายโฆษณา 4K

## อารมณ์และสไตล์:

หรูหรา ทันสมัย เป็นมืออาชีพ แต่ยังดูเป็นมิตรและเข้าถึงง่าย

ให้ความรู้สึกเหมือนภาพถ่ายสำหรับเว็บไซต์บริษัท โปรไฟล์ผู้บริหาร LinkedIn โฆษณาธุรกิจ หรือ personal branding ของผู้หญิงยุคใหม่

ภาพต้องดูเหมือนถ่ายด้วยกล้องจริง ไม่ใช่ภาพ AI

ผิวมีความขาวอมชมพู เนียนละเอียด กระจ่างใส และ luminous แบบพอร์ซเลนผสม glass skin แต่ยังคงรายละเอียด texture ของผิวจริงอย่างละเอียดและเป็นธรรมชาติ

ผิวดูนุ่มละมุน สุขภาพดี มีความฉ่ำวาวพอดี ไม่เป็นพลาสติก ไม่เป็นผิวตุ๊กตา และไม่เรียบจนผิดธรรมชาติ

เน้นความสมจริงของใบหน้า มือ นิ้ว เสื้อผ้า เส้นผม และสัดส่วนร่างกาย

Create an ultra-realistic professional fashion portrait photograph of an Asian working woman, approximately 30–35 years old. She has an elegant and beautiful appearance, presenting as a confident, warm, friendly, and highly professional modern businesswoman.

## Face and Makeup:

A beautiful, sweet, contemporary Asian woman with well-proportioned facial features. Her face looks youthful, elegant, refined, and naturally beautiful.

Makeup style: **Modern K-Beauty with subtle and sophisticated Douyin-inspired details**, carefully balanced to emphasize a fresh, polished, elegant, and luxurious appearance suitable for a professional working woman. Avoid overly dramatic, heavy, or overly fashionable makeup.

Large, round brown eyes with a naturally bright and sparkling appearance. Soft pinkish-brown and light beige eyeshadow blended smoothly and delicately, with a very subtle shimmer on the eyelids to add dimension. Thin, precise eyeliner that is defined but not overly dark. Naturally long, curled eyelashes with a soft, airy appearance, not excessively thick.

Natural-shaped eyebrows matching the hair color, with beautifully separated individual hairs. The eyebrows are soft, natural, and neither too dark nor too thick.

Soft peachy-pink blush applied lightly to the cheeks, with a subtle touch across the bridge of the nose, creating a naturally healthy, fresh, rosy complexion.

The nose has soft and natural dimension created with very subtle contouring. The nose bridge should not appear overly sharp, hard, or heavily sculpted.

Lips are enhanced with a **red-toned nude gradient lip**, with the inner part of the lips slightly deeper in color than the outer edges. The lips look full, fresh, vibrant, and lively.

The lips have a **juicy glossy lip finish**, coated with a clear, wet-looking shine as if covered with a very fine layer of moisture. Natural wet shine and subtle light reflections make the lips visibly plump, hydrated, and dimensional. The lip color is fresh yet luxurious, never too dark, never too pale, and never matte.

Skin tone: **fair with a soft pink undertone, porcelain luminous skin**, finely textured, bright, naturally radiant, and subtly dewy with a refined glass-skin appearance. The skin looks healthy, soft, smooth, and naturally luminous without excessive shine.

Maintain highly realistic and subtle skin texture, with delicate visible natural details and extremely fine pores. Do not make the skin unnaturally smooth. Avoid plastic-looking skin or doll-like skin.
