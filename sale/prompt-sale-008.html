ทสร้างวิดีโอโฆษณาสินค้าแนวตั้ง 9:16 ความยาว 10 วินาที
สไตล์ Cute Minimal Online Seller, Clean Girl, Soft Feminine, Cozy,
Premium และ Natural Product Lifestyle
ใช้สินค้าที่ผู้ใช้แนบมาเป็น HERO PRODUCT และต้องรักษารูปลักษณ์ของสินค้าให้ตรงกับสินค้าต้นฉบับมากที่สุดในทุกเฟรม

IMPORTANT:
ให้ใช้ภาพสินค้าอ้างอิงที่ผู้ใช้แนบมาเป็น REFERENCE หลักสำหรับรูปลักษณ์สินค้าเท่านั้น
ห้ามเปลี่ยนสี รูปทรง ขนาด สัดส่วน โลโก้ ฉลาก ฝา ฝาพับ
หรือรายละเอียดใด ๆ ของสินค้า
จุดเด่นของวิดีโอนี้คือ:

"มือผู้หญิงสวย ๆ ที่แต่งเล็บอย่างประณีต
กำลังถือและนำเสนอสินค้าอย่างเป็นธรรมชาติ"
มือและเล็บต้องดูสวย สุขภาพดี สะอาด
และเป็นมือผู้หญิงจริง
ไม่ต้องเห็นใบหน้าหรือร่างกายเต็มตัว
ให้โฟกัสที่มือ + เล็บ + สินค้าเป็นหลัก

==================================================

SCENE / BACKGROUND
สร้างฉากหลังเป็นโต๊ะถ่ายสินค้าของแม่ค้าออนไลน์หรือContent Creator ผู้หญิง
สไตล์ Cute Minimal, Feminine, Clean และน่ารัก
บรรยากาศเหมือนมุมถ่ายคอนเทนต์สินค้าจริงในบ้านที่จัดไว้อย่างสวยงาม
ไม่ดูเหมือนสตูดิโอแข็ง ๆ และไม่ดูเหมือน CGI

องค์ประกอบฉาก:
โต๊ะสีขาว ครีม หรือ Beige อ่อน
พื้นผิวโต๊ะสะอาด เรียบ และดู Premium
ฉากหลังโทนขาว ครีม ชมพูอ่อนหรือ Beige
มีดอกไม้เล็ก ๆ หรือดอกทิวลิปสีชมพูอ่อน
มีแจกันเซรามิกทรงน่ารัก
มีริบบิ้นหรือผ้าผืนเล็กสีอ่อนวางอย่างเป็นธรรมชาติ
สามารถมีถาดเล็ก ๆหรือแท่นวางสินค้าแบบ Minimal
อาจมีของตกแต่งน่ารัก เช่น โบว์ กระจกเล็ก เทียน หรือของจุกจิกสไตล์ผู้หญิง
ของประกอบฉากต้องมีจำนวนน้อยและจัดวางอย่างมีรสนิยม

ใช้โทนสี:
White
Cream
Beige
Blush Pink
Soft Pink
Warm Nude
Light Brown


ห้ามใช้สีสดจัด
ห้ามให้ Background แย่งความสนใจจากสินค้าและมือ
ฉากควรให้ความรู้สึกเหมือน:

"แม่ค้าออนไลน์ผู้หญิงที่มีรสนิยมกำลังถ่ายสินค้าด้วยตัวเองที่บ้าน"

==================================================

HERO HAND / NAILS
ต้องมีมือผู้หญิงสวยเป็นองค์ประกอบสำคัญตลอดช่วงProduct Demonstration

ลักษณะมือ:
มือผู้หญิงจริง
รูปมือเรียวสวย
นิ้วเรียวยาวและเป็นธรรมชาติ
ผิวดูสุขภาพดี
ผิวมีรายละเอียดแบบคนจริง
ไม่ดูเป็นมือ CGI
ไม่มีเครื่องประดับจำนวนมาก
สามารถใส่แหวนเล็ก ๆ แบบ Minimal ได้ 1 วง หากเหมาะสม

เล็บ:
เล็บสวยและได้รับการดูแลอย่างดี
รูปทรง Almond หรือ Soft Square
ความยาวปานกลาง
Nail Art แบบ Minimal และ Feminine
สีเล็บ Nude Pink / Milky White / Soft Pink / French Tip
สามารถมีลายเล็ก ๆ เช่น ดอกไม้จิ๋ว หัวใจเล็ก ๆ หรือ Pearl Detail

ต้องดูแพงและน่ารัก ไม่แฟนซีเกินไป เล็บต้องดูสะอาด เรียบร้อย
และเหมาะกับภาพลักษณ์ของสินค้า
ห้ามทำเล็บยาวเกินจริง
ห้ามใช้สีเล็บฉูดฉาด
ห้ามมี Nail Art ที่ดึงความสนใจมากกว่าสินค้า

มือ

สร้าง Hookด้วยภาพที่ดูสวยและน่าหยุดดูตั้งแต่เฟรมแรก
ให้ AI วิเคราะห์ประเภทสินค้า จากข้อมูลในภาพที่ 2 ที่แนบไป แล้วสร้างข้อความบรรยายภาษาไทย
ที่เหมาะสมกับสินค้าโดยอัตโนมัติ

- สั้น
- อ่านง่าย
- สื่อถึงจุดเด่นหรือประโยชน์ของสินค้า
- ภาษาไทย
- ไม่ใช้ข้อความยาว
- ไม่ใช้ Subtitle Bar

Cute Bold / Playful Sticker

2–7 วินาที — PRODUCT HOLDING + DEMONSTRATION
ให้มือผู้หญิงเป็นผู้ถือและนำเสนอสินค้าอย่างเป็นธรรมชาติ
ตัวอย่างการเคลื่อนไหว:


 หยิบสินค้าขึ้นมา
 ถือสินค้าให้กล้องเห็น
ค่อย ๆ หมุนสินค้าเพื่อโชว์รายละเอียด
ใช้นิ้วแตะบริเวณจุดเด่น
 เปิดฝาหรือบรรจุภัณฑ์
     หากสินค้าสามารถเปิดได้
กดหรือใช้งานสินค้า หากเหมาะสม

 จัดวางสินค้าลงบนโต๊ะอย่างนุ่มนวล

ให้ AIวิเคราะห์ประเภทสินค้าและวิธีใช้งานจริงจากสินค้าในภาพที่ 1 แนบมา และรายละเอียดสินค้าในภาพที่ 2 ที่แนบมา

แล้วเลือก Action ที่เหมาะสมที่สุดโดยอัตโนมัติ

IMPORTANT:
ทุกการใช้งานต้องสมจริงตามประเภทสินค้านั้น
ห้ามให้มือทำท่าที่ไม่เกี่ยวข้องกับสินค้า
ห้ามใช้ Action ที่เป็นไปไม่ได้
ห้ามสร้างฟังก์ชันของสินค้าที่ไม่มีอยู่จริง

Beauty Product Close-up
Hand Holding Product

Macro Product Shot
ให้มือและสินค้าอยู่ใน Focus

Background ใช้ Natural Depth of Field และ Blurเล็กน้อย

ให้ AIสร้างบทพูดภาษาไทยที่เหมาะสมกับสินค้านั้นโดยอัตโนมัติ

จุดเด่นของสินค้า

<script>
/* 🔢 GET PROMPT NUMBER FROM FILE NAME */
const match = location.pathname.match(/prompt-sale-(\d+)\.html/);
const promptNo = match ? match[1] : "000";

/* SET TITLE TEXT */
document.querySelector("#pageTitle .title-sub").textContent =
  `Prompt ${promptNo}`;
document.title = `หมวดขายสินค้า | Prompt ${promptNo}`;

/* 🧠 AI LIST */
const AI_LIST = [
  "gemini","gemini1","gemini2",

  "leonardo",
  "raphaeal",
  "vheer",

  "manus ai",
  "flow ai"
];

/* 📂 IMAGE PATH */
const IMAGE_PATH = "../images/sale";

/* 🖼 BUILD AI IMAGES (LOAD SAFE) */
const container = document.getElementById("aiImages");

AI_LIST.forEach(ai => {
  const img = new Image();
  img.src = `${IMAGE_PATH}/s${promptNo}-${ai}.jpg`;

  img.onload = () => {
    const box = document.createElement("div");
    box.className = "ai-box";

    img.alt = ai;

    const span = document.createElement("span");
    span.textContent = ai;

    box.appendChild(img);
    box.appendChild(span);
    container.appendChild(box);
  };
});

/* 📋 COPY */
function copyText(id){
  const text = document.getElementById(id);
  text.select();
  navigator.clipboard.writeText(text.value);
  alert("คัดลอกเรียบร้อยแล้ว ✨");
}

/* 🚪 LOGOUT */
function logout(){

}
