    <textarea id="thaiPrompt" rows="8">
    หญิงสาวเอเชียหน้าหวานสไตล์เกาหลี อายุประมาณ 18–22 ปี ถ่ายภาพเซลฟี่หน้ากระจกทรงออร์แกนิก (Organic Mirror) ขนาดใหญ่ที่ตั้งอยู่บนลานสนามหญ้าริมทะเลภายในรีสอร์ตระดับลักชัวรี กระจกตั้งอย่างมั่นคงบนพื้นหญ้าสีเขียวสด หันหน้าออกสู่ทะเล ทำให้สะท้อนทั้งตัวแบบและวิวทะเลอันสวยงามได้อย่างลงตัว เห็นตัวแบบเต็มตัวตั้งแต่ศีรษะจรดรองเท้า

ฉากหลังเป็นรีสอร์ตริมทะเลสไตล์ Tropical Luxury ที่ตกแต่งอย่างเรียบหรู มีสนามหญ้ากว้างสีเขียวสดทอดยาวจนถึงชายหาดสีขาวสะอาด ด้านหน้ามองเห็นน้ำทะเลสีฟ้าอมเขียวใสราวคริสตัล ไล่เฉดสีจากฟ้าอ่อนไปจนถึงน้ำเงินเข้ม คลื่นทะเลซัดเข้าฝั่งเบา ๆ อย่างเป็นธรรมชาติ มีแนวต้นมะพร้าวสูงเรียงรายโอนเอนตามสายลมทะเล ใบมะพร้าวพลิ้วไหวอย่างอ่อนโยน เพิ่มความรู้สึกสดชื่นและผ่อนคลาย

บริเวณสนามหญ้ามีทางเดินหินสีอ่อนทอดยาวไปยังชายหาด ตกแต่งด้วยต้นปาล์ม ต้นเฟิร์น และไม้ประดับเขตร้อนหลากหลายชนิด มีแปลงดอกไม้สีขาว ครีม และชมพูอ่อนแทรกอยู่เป็นระยะ เพิ่มความสดใสแต่ไม่รบกวนสายตา

ด้านหลังตัวแบบมีศาลาไม้สีอ่อนสไตล์บาหลีพร้อมผ้าม่านสีขาวโปร่งพลิ้ว เตียงพักผ่อนริมทะเลพร้อมหมอนสีครีม เก้าอี้อาบแดดไม้พร้อมเบาะผ้าลินินสีขาว โต๊ะไม้เล็กตกแต่งด้วยแจกันดอกไม้สีขาว และร่มชายหาดผ้าใบสีครีมขนาดใหญ่ ทุกองค์ประกอบถูกจัดวางอย่างเป็นระเบียบ ให้ความรู้สึกเหมือนรีสอร์ตระดับ 5 ดาวในมัลดีฟส์ ภูเก็ต หรือเกาะสมุย

ไกลออกไปมองเห็นวิลล่าหลังคามุงจากสไตล์โมเดิร์นทรอปิคอล และสะพานไม้ทอดยื่นลงทะเลเล็กน้อย เพิ่มมิติและความหรูหราให้กับภาพ โดยอาคารทั้งหมดถูกเบลอเล็กน้อยเพื่อให้ตัวแบบโดดเด่นเป็นจุดสนใจหลัก

ช่วงเวลาถ่ายภาพเป็น Golden Hour ก่อนพระอาทิตย์ตกประมาณ 30–45 นาที แสงอาทิตย์สีทองนุ่ม ๆ ส่องเฉียงจากด้านข้าง เกิดไฮไลต์สวยงามบนเส้นผม ผิว และเสื้อผ้า แสงสะท้อนผิวน้ำทะเลเป็นประกายระยิบระยับอย่างเป็นธรรมชาติ ท้องฟ้าสีฟ้าอ่อนค่อย ๆ ไล่เฉดไปเป็นสีพีช ครีม และทอง มีเมฆขาวบางฟุ้งนุ่ม ช่วยสร้างบรรยากาศโรแมนติก อบอุ่น และผ่อนคลาย

โทนสีโดยรวมของภาพเป็น Cream, Beige, Warm White, Soft Blue, Turquoise, Tropical Green และ Golden Sunlight ให้ความรู้สึกสะอาด สดชื่น หรูหรา และเป็นธรรมชาติ เหมาะสำหรับการรีวิวเสื้อผ้าแฟชั่นผู้หญิง

ลักษณะตัวแบบ:
หญิงสาวเอเชียหน้าหวานสไตล์เกาหลี อายุประมาณ 18–22 ปี ผิวขาวอมชมพู เรียบเนียนสุขภาพดี ผิวโกลว์อย่างเป็นธรรมชาติ ใบหน้ารูปไข่ ดวงตากลมโตเป็นประกาย ยิ้มหวานเห็นฟันเล็กน้อย แต่งหน้าแบบ Clean Girl และ Korean Makeup เน้นงานผิว บลัชออนสีชมพูอ่อน แก้มระเรื่อ ริมฝีปากสีชมพูนู้ดฉ่ำสุขภาพดี คิ้วทรงธรรมชาติ ขนตางอนยาว ดวงตาดูสดใสมีชีวิตชีวา

ผมยาวตรงสีน้ำตาลอ่อน แสกกลาง ยาวถึงช่วงเอว เส้นผมเงางาม มีปอยผมด้านหน้าปลิวเบา ๆ ตามแรงลมทะเลอย่างเป็นธรรมชาติ เส้นผมดูนุ่มพลิ้ว เพิ่มความรู้สึกสดใสและมีชีวิตชีวา

เสื้อผ้า:
สวมเสื้อผ้าตามภาพอ้างอิงทุกประการ ทั้งสี รูปทรง ดีไซน์ ลวดลาย รายละเอียดของเนื้อผ้า และการตัดเย็บตรงกับต้นฉบับ เห็นรายละเอียดของผ้าได้อย่างคมชัด เหมาะสำหรับการรีวิวแฟชั่น โชว์ทรงเสื้อผ้า และการแมตช์ลุคแบบเต็มตัว

ท่าทาง:
มือขวาถือสมาร์ตโฟนสีเงินหรือสีเทาอ่อน ยกขึ้นถ่ายเซลฟี่ โทรศัพท์บังใบหน้าส่วนใหญ่ไว้ มองหน้าจอมือถือเล็กน้อย ยืนตัวตรงในท่าผ่อนคลาย ไหล่สบาย หลังตรง ขาทั้งสองชิดกันเล็กน้อย ปลายเท้าหันออกเล็กน้อย ให้ความรู้สึกเป็นธรรมชาติ สดใส น่ารัก เหมือนอินฟลูเอนเซอร์สายแฟชั่นกำลังถ่ายภาพ Outfit of the Day ระหว่างพักผ่อนที่รีสอร์ตริมทะเล

องค์ประกอบภาพ:
ถ่ายผ่านเงาสะท้อนในกระจก Organic Mirror ขนาดใหญ่ ขอบกระจกสีเทาเข้มหรือสีดำด้าน ดีไซน์โค้งมนทันสมัย กระจกกินพื้นที่ประมาณ 80–90% ของเฟรม จัดวางตัวแบบไว้กึ่งกลางภาพ เว้นพื้นที่ด้านบนให้เห็นท้องฟ้า ต้นมะพร้าว และแสงอาทิตย์เล็กน้อย พร้อมเปิดมุมกว้างให้เห็นสนามหญ้า ชายหาด ทะเล รีสอร์ต และแนวต้นไม้ได้อย่างสมดุล

บริเวณรอบกระจกมีเก้าอี้หวายสีธรรมชาติ โต๊ะไม้โอ๊คขนาดเล็ก แจกันดอกไม้สีขาว กระเป๋าสาน หมวกปีกกว้าง และผ้าปิกนิกสีครีมวางอย่างเป็นธรรมชาติ เพิ่มความรู้สึกเหมือนมุมถ่ายภาพยอดนิยมของรีสอร์ตหรู โดยไม่มีผู้คนอื่นอยู่ในเฟรม ทำให้ภาพสะอาดและเน้นตัวแบบอย่างเต็มที่

<script>
/* 🔢 GET PROMPT NUMBER FROM FILE NAME */
const match = location.pathname.match(/prompt-sale-(\d+)\.html/);
const promptNo = match ? match[1] : "000";

/* SET TITLE TEXT */
document.querySelector("#pageTitle .title-sub").textContent =
  `Prompt ${promptNo}`;
document.title = `หมวดขายสินค้า | Prompt ${promptNo}`;

/* 🧠 AI LIST */
const AI_LIST = [
  "gemini",
  "whisk",
  "meta",
  "copilot",
  "chatgpt",
  "leonardo",
  "raphaeal",
  "vheer",
  "kling",
  "bing",
  "dreamina",
  "manus ai",
  "flow ai"
];

/* 📂 IMAGE PATH */
const IMAGE_PATH = "../images/sale";

/* 🖼 BUILD AI IMAGES (LOAD SAFE) */
const container = document.getElementById("aiImages");

AI_LIST.forEach(ai => {
  const img = new Image();
  img.src = `${IMAGE_PATH}/s${promptNo}-${ai}.jpg`;

  img.onload = () => {
    const box = document.createElement("div");
    box.className = "ai-box";

    img.alt = ai;

    const span = document.createElement("span");
    span.textContent = ai;

    box.appendChild(img);
    box.appendChild(span);
    container.appendChild(box);
  };
});

/* 📋 COPY */
function copyText(id){
  const text = document.getElementById(id);
  text.select();
  navigator.clipboard.writeText(text.value);
  alert("คัดลอกเรียบร้อยแล้ว ✨");
}

/* 🚪 LOGOUT */
function logout(){
  if(confirm("ต้องการออกจากระบบหรือไม่?")){
    localStorage.removeItem("loggedIn");
    window.location.href = "index.html";
  }
}
</script>
