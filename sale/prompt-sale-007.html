IMPORTANT:
ให้ใช้ภาพอ้างอิงที่แนบมาเป็น REFERENCE สำหรับ "บรรยากาศ ฉากหลัง โทนสี แสง การจัดองค์ประกอบ และ Mood & Tone" เท่านั้น
ไม่ต้องคัดลอกสินค้าในภาพอ้างอิง
ให้ใช้สินค้าที่ผู้ใช้แนบมาเป็นสินค้าหลักของวิดีโอ

==================================================
SCENE / BACKGROUND
==================================================

สร้างฉากเป็นโต๊ะเครื่องแป้งหรือ Beauty Vanity ของผู้หญิงสไตล์ Clean Girl

บรรยากาศใกล้เคียงภาพ Reference:
- โต๊ะสีขาวหรือสีครีม พื้นผิวสะอาดและเรียบ
- กระจกตั้งโต๊ะหรือกระจก Vanity ขอบสีชมพูพาสเทลทรงโค้งมน
- มีดอกทิวลิปหรือดอกไม้โทนชมพูอ่อนอยู่ด้านหลัง
- มีของใช้ Beauty ขนาดเล็กวางอยู่ด้านหลังอย่างเป็นระเบียบ
- มีขวดสกินแคร์ เครื่องสำอาง น้ำหอม หรือของตกแต่งเล็ก ๆ ในโทนสีอ่อน
- สามารถมีเทียนหรือของตกแต่งทรงน่ารักแบบ Minimal
- ใช้สี White, Cream, Beige, Blush Pink, Soft Pink และ Warm Brown
- ห้ามใช้สีสดจัดหรือสีที่แย่งความสนใจจากสินค้า
- ฉากหลังต้องดูเป็นห้องจริง ไม่ใช่ฉาก CGI ที่แข็งหรือดูปลอม

จัดวางองค์ประกอบให้มี Depth และ Layer:
Foreground = สินค้าหลัก
Midground = โต๊ะเครื่องแป้งและของตกแต่ง
Background = กระจก ดอกไม้ และพื้นที่ห้อง

ให้ Background มีความเบลอเล็กน้อยด้วย Natural Depth of Field เพื่อให้สินค้าคมชัดและโดดเด่นที่สุด

แสงเป็น Soft Natural Daylight ผสม Warm Ambient Light
แสงนุ่ม กระจายสวย ไม่มีเงาแข็ง
ให้มี Highlight บาง ๆ บนตัวสินค้าและพื้นผิวโต๊ะ
ภาพโดยรวมสว่าง นุ่ม อบอุ่น และดู Premium

==================================================
0–2 วินาที — ATTENTION HOOK
==================================================

เปิดด้วย Close-up ของสินค้าในบรรยากาศ Vanity แบบ Clean Girl

สินค้าอยู่บริเวณกึ่งกลางหรือจุดเด่นของเฟรม
กล้องค่อย ๆ Push-in เข้าหาสินค้าอย่างนุ่มนวล
หรือเริ่มจากภาพสินค้าในระยะใกล้แล้วค่อย Reveal บรรยากาศรอบ ๆ

ให้สินค้าดูสะอาด น่าใช้ และ Premium ตั้งแต่เฟรมแรก

สร้าง Hook ด้วยภาพและข้อความสั้น ๆ ที่เหมาะสมกับประเภทสินค้า
ให้ AI เลือกข้อความภาษาไทยที่เหมาะสมกับสินค้าโดยอัตโนมัติ

ข้อความต้อง:
- สั้น
- อ่านง่าย
- สื่อถึงประโยชน์หรือความน่าสนใจของสินค้า
- เป็นภาษาไทย
- ไม่ใช้ข้อความยาว
- ไม่ใช้ Subtitle Bar

ใช้ Typography แบบ Handwritten / Elegant Clean Girl สีขาว
Animation เป็นลักษณะเขียนด้วยมืออย่างนุ่มนวล

==================================================
2–7 วินาที — PRODUCT DEMONSTRATION
==================================================

นำเสนอวิธีใช้งานสินค้าหรือจุดเด่นสำคัญของสินค้าอย่างรวดเร็วและเข้าใจง่าย

หากสินค้าเป็นประเภทที่สามารถสาธิตการใช้งานได้:
ให้แสดงมือผู้หญิงหยิบ เปิด กด ทา ใช้ หรือสาธิตสินค้าตามวิธีใช้งานจริงของสินค้านั้น

หากสินค้าไม่เหมาะกับการสาธิต:
ให้ใช้ Close-up, Product Detail Shot, การหมุนสินค้า, การเปิดบรรจุภัณฑ์ หรือการแสดงคุณสมบัติเด่นของสินค้าแทน

ให้ AI วิเคราะห์ "ประเภทสินค้า คุณสมบัติ และวิธีใช้งานจริง" จากสินค้าที่แนบมา
แล้วเลือกวิธีนำเสนอที่เหมาะสมที่สุด

VOICEOVER:
ช่วง 2–7 วินาที ให้มีเสียงพากย์ผู้หญิงไทย
น้ำเสียงเป็นธรรมชาติ อบอุ่น สดใส และน่าเชื่อถือ

ไม่ต้องใช้บทพูดตายตัว
ให้ AI สร้างคำพูดภาษาไทยที่เหมาะสมกับสินค้านั้นโดยอัตโนมัติ
เน้นอธิบาย "วิธีใช้งาน หรือจุดเด่นสำคัญ หรือประโยชน์ของสินค้า"
พูดให้กระชับ เข้าใจง่าย และฟังเหมือนการแนะนำสินค้าจากผู้ใช้จริง ไม่ใช่การอ่านโฆษณาแข็ง ๆ

ตัวอย่างแนวทางเท่านั้น:
- หากเป็น Skincare → เน้นวิธีใช้และความรู้สึกหลังใช้
- หากเป็น Hair Care → เน้นวิธีใช้และผลลัพธ์ที่ต้องการ
- หากเป็น Beauty Tool → เน้นวิธีใช้งานและจุดเด่นของอุปกรณ์
- หากเป็นของใช้ทั่วไป → เน้นวิธีใช้งานและประโยชน์ที่เห็นได้ชัด

ห้ามใช้คำพูดที่ไม่เกี่ยวข้องกับสินค้า
ห้ามกล่าวอ้างคุณสมบัติที่มองไม่เห็นหรือไม่มีข้อมูลรองรับ
ห้ามสร้างสรรพคุณเกินจริง

==================================================
7–10 วินาที — RESULT + CALL TO ACTION
==================================================

แสดงภาพสินค้าในมุมที่สวยที่สุดบนโต๊ะ Vanity

หากสินค้าสามารถแสดงผลลัพธ์หลังใช้งานได้:
ให้แสดงผลลัพธ์ที่สอดคล้องกับการใช้งานจริงของสินค้า

หากไม่สามารถแสดงผลลัพธ์โดยตรง:
ให้แสดงสินค้าหลังใช้งานในสภาพแวดล้อม Clean Girl ที่สวยงาม
พร้อมมือผู้หญิงวางสินค้าอย่างเป็นธรรมชาติ

กล้องค่อย ๆ Push-in หรือ Dolly-in เข้าหาสินค้า
ให้เกิด Soft Glow และ Natural Highlight บริเวณสินค้า

ช่วงท้ายให้มีข้อความ Call to Action สั้น ๆ ภาษาไทยที่เหมาะสมกับการซื้อสินค้า

VOICEOVER:
ต้องมีคำกระตุ้นให้สั่งซื้ออย่างชัดเจน
และต้องพูดคำว่า:

"กดสั่งที่ตะกร้า"

พูดด้วยน้ำเสียงเป็นธรรมชาติ ไม่ตะโกน และไม่เร่งจนเกินไป
