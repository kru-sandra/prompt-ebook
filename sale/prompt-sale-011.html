    <textarea id="thaiPrompt" rows="8">
สร้างวิดีโอโฆษณาสินค้าแนวตั้ง 9:16 ความยาว 10 วินาที
สไตล์ Cute Minimal Online Seller, Clean Girl, Soft Feminine, Cozy, Premium และ Natural Product Lifestyle
ใช้สินค้าที่ผู้ใช้แนบมาเป็น HERO PRODUCT และรักษารูปลักษณ์ให้ตรงกับสินค้าต้นฉบับมากที่สุดในทุกเฟรม
IMPORTANT:
ใช้ภาพสินค้าอ้างอิงที่ผู้ใช้แนบมาเป็น REFERENCE หลักสำหรับรูปลักษณ์สินค้าเท่านั้น ห้ามเปลี่ยนสี รูปทรง ขนาด สัดส่วน โลโก้ ฉลาก ฝา ฝาพับ หรือรายละเอียดใด ๆ ของสินค้า
จุดเด่นของวิดีโอนี้คือผู้หญิงไทยหนึ่งคนกำลังพูดแนะนำและถือ HERO PRODUCT อย่างเป็นธรรมชาติ ให้เห็นใบหน้าและช่วงตัวในระดับที่เหมาะกับการพูดกับกล้อง พร้อมเห็นมือและเล็บที่ดูแลอย่างประณีตขณะถือหรือนำเสนอสินค้า
ผู้หญิงมีสีหน้าเป็นมิตร ยิ้มอย่างเป็นธรรมชาติ มองกล้องเป็นระยะ และพูดด้วยท่าทางผ่อนคลาย ผู้หญิง สินค้า เสื้อผ้า และฉากต้องดูสมจริง เข้ากับสไตล์ Cute Minimal, Clean Girl, Soft Feminine, Cozy และ Premium ให้สินค้าเป็นจุดสนใจหลัก ใบหน้าและท่าทางช่วยเสริมการนำเสนอโดยไม่แย่งความสนใจจากสินค้า
==================================================
SCENE / BACKGROUND
สร้างฉากหลังเป็นโต๊ะถ่ายสินค้าของแม่ค้าออนไลน์หรือ Content Creator ผู้หญิง สไตล์ Cute Minimal, Feminine, Clean และน่ารัก บรรยากาศเหมือนมุมถ่ายคอนเทนต์สินค้าจริงในบ้านที่จัดไว้อย่างสวยงาม ไม่ดูเหมือนสตูดิโอแข็ง ๆ และไม่ดูเหมือน CGI
องค์ประกอบฉาก:
- โต๊ะสีขาว ครีม หรือ Beige อ่อน
- พื้นผิวโต๊ะสะอาด เรียบ และดู Premium
- ฉากหลังโทนขาว ครีม ชมพูอ่อน หรือ Beige
- มีดอกไม้เล็ก ๆ หรือดอกทิวลิปสีชมพูอ่อน
- มีแจกันเซรามิกทรงน่ารัก
- มีริบบิ้นหรือผ้าผืนเล็กสีอ่อนวางอย่างเป็นธรรมชาติ
- สามารถมีถาดเล็ก ๆ หรือแท่นวางสินค้าแบบ Minimal
- อาจมีของตกแต่งน่ารัก เช่น โบว์ กระจกเล็ก เทียน หรือของจุกจิกสไตล์ผู้หญิง
- ของประกอบฉากต้องมีจำนวนน้อยและจัดวางอย่างมีรสนิยม
ใช้โทนสี:
White, Cream, Beige, Blush Pink, Soft Pink, Warm Nude และ Light Brown
ห้ามใช้สีสดจัด ห้ามให้ Background แย่งความสนใจจากสินค้าและผู้หญิง ฉากควรให้ความรู้สึกเหมือนแม่ค้าออนไลน์ผู้หญิงที่มีรสนิยมกำลังถ่ายสินค้าด้วยตัวเองที่บ้าน
==================================================
ผู้หญิง / ใบหน้า / การพูด
ให้มีผู้หญิงไทยเพียงหนึ่งคนปรากฏตลอดวิดีโอ เป็นคนเดียวกันทุกฉาก ลุคสะอาด สุภาพ เป็นกันเอง และเข้ากับภาพลักษณ์ Cute Minimal Online Seller, Clean Girl และ Soft Feminine
ให้เห็นใบหน้าและช่วงตัวอย่างเป็นธรรมชาติ เหมาะกับการพูดแนะนำสินค้ากับกล้อง สีหน้าเป็นมิตร ยิ้มอย่างพอดี และสบตากล้องเป็นระยะ ไม่แสดงท่าทางเกินจริง
การพูดต้องเป็นภาษาไทย เสียงเป็นธรรมชาติ ชัดเจน และตรงกับการขยับปากทุกช่วง ห้ามใช้เสียงพากย์นอกฉากแทนการพูดหน้ากล้อง
==================================================
HERO HAND / NAILS
มือผู้หญิงต้องดูสวย เป็นองค์ประกอบสำคัญตลอดช่วง Product Demonstration
ลักษณะมือ:
- มือผู้หญิงจริง รูปมือเรียวสวย นิ้วเรียวยาวและเป็นธรรมชาติ
- ผิวดูสุขภาพดี มีรายละเอียดแบบคนจริง ไม่ดูเป็นมือ CGI
- ไม่มีเครื่องประดับจำนวนมาก สามารถใส่แหวนเล็ก ๆ แบบ Minimal ได้ 1 วง หากเหมาะสม
เล็บ:
- เล็บสวยและได้รับการดูแลอย่างดี
- รูปทรง Almond หรือ Soft Square ความยาวปานกลาง
- Nail Art แบบ Minimal และ Feminine
- สี Nude Pink / Milky White / Soft Pink / French Tip
- สามารถมีลายเล็ก ๆ เช่น ดอกไม้จิ๋ว หัวใจเล็ก ๆ หรือ Pearl Detail
เล็บต้องดูแพงและน่ารัก ไม่แฟนซีเกินไป สะอาด เรียบร้อย และเหมาะกับภาพลักษณ์ของสินค้า ห้ามทำเล็บยาวเกินจริง ห้ามใช้สีเล็บฉูดฉาด และห้ามมี Nail Art ที่ดึงความสนใจมากกว่าสินค้า
==================================================
0–2 วินาที — ATTENTION HOOK
เปิดด้วยภาพผู้หญิงยิ้มและมองกล้อง พร้อมถือสินค้ายกเข้ามาในเฟรมอย่างนุ่มนวล เธอพูดประโยคเปิดสั้น ๆ ภาษาไทยที่ AI สร้างให้เหมาะกับสินค้า โดยอ้างอิงเฉพาะข้อมูลที่เห็นหรือได้รับ
จัดเฟรมให้เห็นใบหน้า มือ เล็บ และสินค้าอย่างสมดุล จากนั้นค่อย ๆ ขยับกล้องเข้าใกล้สินค้า ให้สินค้าอยู่ในตำแหน่งเด่นของภาพ มือและเล็บช่วยสร้างความรู้สึก Feminine และ Premium
ใช้กล้อง Slow Push-in หรือ Gentle Tracking Shot ให้เห็นรายละเอียดสินค้า มือ เล็บ และ Texture ของสินค้า ฉากหลัง Minimal สร้าง Hook ที่ดูสวยและน่าหยุดดูตั้งแต่เฟรมแรก
ให้ AI วิเคราะห์ประเภทสินค้าจากข้อมูลในภาพที่ 2 ที่แนบมา แล้วสร้างข้อความสั้น ๆ ภาษาไทยที่เหมาะกับสินค้าโดยอัตโนมัติ ข้อความต้องอ่านง่าย สื่อถึงจุดเด่นหรือประโยชน์ของสินค้า และไม่ใช้ Subtitle Bar
Typography:
Cute Bold / Playful Sticker ตัวอักษรภาษาไทยหนา กลมมน อวบอิ่ม สไตล์ Bubble Cartoon โทนสีพาสเทล พร้อมขอบสีดำและขอบสีขาวแบบสติกเกอร์
Animation:
Cute Pop-up Animation แบบเด้งนุ่มนวล ให้ข้อความค่อย ๆ ปรากฏและขยับเด้งเล็กน้อยอย่างสนุกสนาน
==================================================
2–7 วินาที — PRODUCT HOLDING + DEMONSTRATION
ให้ผู้หญิงคนเดิมพูดกับกล้องโดยตรงระหว่างถือและสาธิตสินค้า การขยับปากต้องตรงกับเสียงพูดภาษาไทยอย่างเป็นธรรมชาติ ให้มือผู้หญิงถือและนำเสนอสินค้าอย่างเป็นธรรมชาติ ตัวอย่างการเคลื่อนไหว:
- หยิบสินค้าขึ้นมา
- ถือสินค้าให้กล้องเห็น
- ค่อย ๆ หมุนสินค้าเพื่อโชว์รายละเอียด
- ใช้นิ้วแตะบริเวณจุดเด่น
- เปิดฝาหรือบรรจุภัณฑ์ หากสินค้าสามารถเปิดได้
- กดหรือใช้งานสินค้า หากเหมาะสม
- จัดวางสินค้าลงบนโต๊ะอย่างนุ่มนวล
ให้ AI วิเคราะห์ประเภทสินค้าและวิธีใช้งานจริงจากสินค้าในภาพที่ 1 และรายละเอียดสินค้าในภาพที่ 2 ที่แนบมา แล้วเลือก Action ที่เหมาะสมที่สุดโดยอัตโนมัติ
ทุกการใช้งานต้องสมจริงตามประเภทสินค้านั้น ห้ามให้มือทำท่าที่ไม่เกี่ยวข้องกับสินค้า ห้ามใช้ Action ที่เป็นไปไม่ได้ และห้ามสร้างฟังก์ชันของสินค้าที่ไม่มีอยู่จริง
เน้น Shot แบบ Beauty Product Close-up, Hand Holding Product, Product Detail, Natural Hand Movement และ Macro Product Shot ให้ใบหน้า มือ และสินค้าอยู่ใน Focus อย่างสมดุล โดยไม่บังรายละเอียดสำคัญของสินค้า
Background ใช้ Natural Depth of Field และ Blur เล็กน้อย
บทพูดช่วง 2–7 วินาที:
ผู้หญิงพูดกับกล้องด้วยน้ำเสียงหวานแบบเป็นธรรมชาติ สดใส อบอุ่น และน่าเชื่อถือ เหมือนแม่ค้าออนไลน์กำลังแนะนำสินค้าให้ลูกค้า ไม่เป็นเสียงโฆษณาแข็ง ๆ ให้ AI สร้างบทพูดภาษาไทยที่เหมาะสมกับสินค้านั้นโดยอัตโนมัติ เน้นจุดเด่น วิธีใช้งาน ประโยชน์ที่เข้าใจง่าย หรือความรู้สึกหลังใช้งาน หากมีข้อมูลรองรับ
ห้ามกล่าวอ้างสรรพคุณเกินจริง ห้ามสร้างข้อมูลที่ไม่มีหลักฐานจากสินค้า บทพูดต้องสั้น กระชับ และพอดีกับช่วงเวลา
==================================================
7–10 วินาที — HERO SHOT + CALL TO ACTION
สร้าง Hero Shot ที่สวยที่สุดของวิดีโอ ให้ผู้หญิงคนเดิมถือสินค้าอยู่ใกล้กล้อง หรือวางสินค้าไว้บนโต๊ะแล้วมือค่อย ๆ จัดตำแหน่งสินค้าอย่างเป็นธรรมชาติ เธอถือสินค้าให้เห็นชัด โดยหันฉลากหรือด้านสำคัญเข้าหากล้องตามรูปทรงสินค้าจริง
เน้น:
- สินค้าคมชัด
- เล็บสวยและมือดูเป็นธรรมชาติ
- ใบหน้าและสีหน้าเป็นมิตร
- Background น่ารัก
- แสง Soft และ Premium
กล้องค่อย ๆ Push-in เข้าหาสินค้า สามารถเพิ่ม Soft Glow และ Natural Highlight บริเวณสินค้าเล็กน้อย
ช่วงท้ายให้แสดงข้อความ Call to Action ภาษาไทยแบบสั้น ๆ ตัวอย่าง:
- “น่ารักมาก ต้องมีแล้ว 💗”
- “ชอบแบบนี้ กดสั่งเลย”
- “กดสั่งที่ตะกร้าตอนนี้เลย 🛒”
ให้ AI เลือกข้อความที่เหมาะสมกับสินค้าจริงโดยอัตโนมัติ ผู้หญิงพูด Call to Action ด้วยน้ำเสียง Soft Selling เป็นธรรมชาติ ไม่ตะโกน ไม่เร่ง และไม่ฟังเหมือน Hard Sell ข้อความและเสียงพูดต้องสื่อให้ผู้ชมเข้าใจว่าต้องกดตะกร้าเพื่อสั่งซื้อ
==================================================

/* 📂 IMAGE PATH */
const IMAGE_PATH = "../images/sale";

/* 🖼 LOAD THE THREE PROMPT 011 EXAMPLE IMAGES */
const container = document.getElementById("aiImages");
[
  { file: "S011-1.webp", label: "ภาพตัวอย่าง 1" },
  { file: "S011-2.webp", label: "ภาพตัวอย่าง 2" },
  { file: "S011-3.webp", label: "ภาพตัวอย่าง 3" }
].forEach(item => {
  const img = new Image();
  img.src = `${IMAGE_PATH}/${item.file}`;
  img.onload = () => {
    const box = document.createElement("div");
    box.className = "ai-box";
    img.alt = item.label;
    const span = document.createElement("span");
    span.textContent = item.label;
    box.appendChild(img);
    box.appendChild(span);
    container.appendChild(box);
  };
});

/* 📋 COPY */
function copyText(id){
  const text = document.getElementById(id);
  text.select();
  navigator.clipboard.writeText(text.value);
  alert("คัดลอกเรียบร้อยแล้ว ✨");
}

/* 🚪 LOGOUT */
function logout(){
  if(confirm("ต้องการออกจากระบบหรือไม่?")){
    localStorage.removeItem("loggedIn");
    window.location.href = "index.html";
  }
}
