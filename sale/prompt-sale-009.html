  <div class="prompt-box">
    <h3>Thai Prompt :</h3>
    <textarea id="thaiPrompt" rows="8">
สร้างภาพผู้หญิง ให้ใบหน้าเดิมตามไฟล์แนบ 100% ไม่เปลี่ยนแปลง 

ผิวขาวอมชมพูมาก เนียนใส

ผมยาวหนามากถึงเอว ลอนใหญ่เบาๆ เป็นธรรมชาติ มีวอลลุ่ม ผมสีน้ำตาลเข้มมีปอยผมเล็กน้อย ปล่อยผมปลิวปิดหน้าเล็กน้อย ไม่มีหน้าม้า

แต่งหน้า: การแต่งหน้า: สไตล์ K-Beauty Douyin ดวงตาสีน้ําตาลกลมโต ขนตายาวงอน บลัชออนสีชมพูทั่วแก้มและสันจมูก ริมฝีปากมันวาวสีชมพูไล่ระดับสีอวบอิ่มพร้อมผิวน้ํา   สีหน้าน่ารัก ขี้เล่นปนเซ็กซี่ ดูมีเสน่ห์


การแต่งกาย: 

เสื้อด้านบน

เสื้อครอปท็อปสีขาวงาช้าง / off-white ทรงเข้ารูปพอดีตัว ความยาวประมาณเหนือเอวเล็กน้อย เผยช่วงเอวและหน้าท้องเล็กน้อย

ตัวเสื้อเป็นผ้ายืดเนื้อนุ่มบางปานกลาง มี texture แบบ ruched / gathered fabric เป็นริ้วจีบแนวนอนละเอียดทั่วทั้งตัว ตั้งแต่ช่วงอกลงมาถึงชายเสื้อ ทำให้เนื้อผ้าดูมีมิติและแนบไปกับสรีระอย่างเป็นธรรมชาติ

ช่วงอกเป็นทรง square neckline / softly curved straight neckline เปิดช่วงไหปลาร้าและหัวไหล่เล็กน้อย แต่ยังดู elegant ไม่โป๊

สายเสื้อเป็นสายเล็กแบบ spaghetti straps แต่จุดเด่นคือสายทำจาก gold-tone chunky chain links ขนาดเล็กถึงปานกลาง เชื่อมต่อจากด้านหน้าไปด้านหลัง ให้ความรู้สึกเหมือนเครื่องประดับที่เป็นส่วนหนึ่งของเสื้อ

ช่วงอกและลำตัวเข้ารูปพอดี แต่ไม่รัดจนเกิดความผิดธรรมชาติ ชายเสื้อเป็นขอบตรงและหยุดบริเวณเอวเหนือขอบกางเกงเล็กน้อย

สีเสื้อเป็น warm ivory white / soft creamy white ไม่ใช่ขาวสว่างจัด เนื้อผ้าดู matte เล็กน้อย ไม่มันวาว และมี realistic fabric texture

2. กางเกงยีนส์

กางเกงยีนส์ high-waisted ultra wide-leg jeans เอวสูงมาก โดยขอบเอวอยู่บริเวณเอวธรรมชาติ

สีเป็น light vintage washed blue denim หรือสีฟ้าเดนิมฟอกอ่อน มีความแตกต่างของเฉดสีตามบริเวณที่เกิดการยับและการเสียดสี ให้ texture เหมือนผ้ายีนส์จริง

ทรงกางเกงกว้างตั้งแต่สะโพกลงไปจนถึงปลายขา เป็น very wide-leg / relaxed palazzo denim silhouette ไม่รัดต้นขา ไม่เข้ารูป และไม่ใช่ทรง skinny หรือ straight-leg

ช่วงสะโพกและเอวพอดีตัว มี waistband ที่ค่อนข้างชัดเจน พร้อม belt loops และกระดุมโลหะสีเงิน/เงินหม่น

ด้านหน้ามีรายละเอียดกางเกงยีนส์แบบคลาสสิก:

front button closure
zipper fly
belt loops
classic five-pocket construction
กระเป๋าหน้าทั้งสองข้าง
กระเป๋าหลังแบบเรียบง่าย
stitching สี denim/ทองอ่อนที่มองเห็นได้เล็กน้อย

เนื้อ denim ค่อนข้างมีน้ำหนักและอยู่ทรง แต่มีรอยยับธรรมชาติบริเวณเอว สะโพก หัวเข่า และข้อเท้า

ชายกางเกง ยาวมากจนเกือบคลุมรองเท้า และมี slight stacking / natural pooling บริเวณปลายขาเล็กน้อย ให้ลุค fashion-forward และขายาวเป็นพิเศษ

สถานที่:
คาเฟ่ริมถนนสไตล์ Parisian / European contemporary café มีหน้าต่างกระจกบานใหญ่ กรอบหน้าต่างสีดำหรือเข้ม ด้านหลังเป็นอาคารสถาปัตยกรรมยุโรปคลาสสิกผสมโมเดิร์น มีต้นไม้ริมถนน รถยนต์ และผู้คนในคาเฟ่เป็น background

มีโต๊ะกลมสีดำด้านอยู่ด้านหน้าภาพ พร้อมเก้าอี้หรือม้านั่งไม้สีธรรมชาติ บริเวณพื้นเป็นทางเท้าคอนกรีต/หินสีเทาอ่อน

พร็อพ:
แก้วเครื่องดื่มเย็นใสมีน้ำแข็งและหลอดสีเข้มวางอยู่ในมือหรือบนโต๊ะ ให้เห็นหยด condensation บนแก้วอย่างสมจริง
มีแว่นตากันแดดกรอบสีเข้มวางอยู่บนโต๊ะใกล้กระเป๋า

หญิงสาวนั่งโพสต์ท่าหน้าคาเฟ่  ถือสินค้า( ให้ AI วิเคราะห์ประเภทสินค้า จากข้อมูลในภาพที่ 2 ที่แนบไป)  โชว์ 

คาเฟ่มีดอกไม้ประดับสวยงาม 

ภาพถ่ายระยะใกล้ เห็น detail ชุดชัดเจน
Canon EOS R5, เลนส์ 85 มม. f/1.2, รูรับแสง f/1.2, DOF ตื้นพิเศษ, ผิวพอร์ซเลนเปล่งประกาย, สุนทรียศาสตร์แฟชั่นที่เน้นรายละเอียดอย่างพิถีพิถัน, อัตราส่วนภาพ 9:16–ไคฮเปอร์เรียลลิสม์
      
    </textarea>

  <!-- ENGLISH PROMPT -->
  <div class="prompt-box">
    <h3>English Prompt :</h3>
    <textarea id="engPrompt" rows="8">    
Portrait photo in a realistic smartphone photography style (User-Generated Content / UGC), captured from a first-person perspective while standing in the clothing section of a large department store or supermarket in Thailand.

Main Composition:
Two female hands are holding and clearly presenting the product at the center of the frame. One hand is holding the top of the luxury clothes hanger, while the other gently supports or touches the garment. The hands have slim, elegant fingers with solid-color polished nails, wearing a delicate fashion ring and a thin gold bracelet.

The product being held is the attached reference image. Preserve the product's design, details, colors, shape, and overall appearance as accurately as possible, closely matching the original reference. The product is displayed on an elegant premium clothes hanger.

Background & Atmosphere:
The setting is inside a modern Thai department store with high ceilings and bright overhead lighting. The main focus is on the product in the center, while the background is softly blurred with a shallow depth of field. Clothing racks filled with various colorful garments are visible in the distance.

At the bottom of the image, there is a yellow Thai-style price tag attached to a metal clothing rack. The tag displays a clear promotional message in black Thai/Arabic numerals, for example:
"Clearance Sale – 39 THB each"

Lighting & Color:
Bright indoor department store lighting, with natural, realistic colors and soft tones. Avoid excessive color grading or oversaturation. The image should feel authentic, as if someone is casually shopping and taking a genuine product review photo with a smartphone.

Aspect Ratio: 9:16
Resolution: 4K
      
    </textarea>

<script>
/* 🔢 GET PROMPT NUMBER FROM FILE NAME */
const match = location.pathname.match(/prompt-sale-(\d+)\.html/);
const promptNo = match ? match[1] : "000";

/* SET TITLE TEXT */
document.querySelector("#pageTitle .title-sub").textContent =
  `Prompt ${promptNo}`;
document.title = `หมวดขายสินค้า | Prompt ${promptNo}`;

/* 🧠 AI LIST */
const AI_LIST = [
  "gemini",
  "whisk",
  "meta",
  "copilot",
  "chatgpt",
  "leonardo",
  "raphaeal",
  "vheer",
  "kling",
  "bing",
  "dreamina",
  "manus ai",
  "flow ai"
];

/* 📂 IMAGE PATH */
const IMAGE_PATH = "../images/sale";

/* 🖼 BUILD AI IMAGES (LOAD SAFE) */
const container = document.getElementById("aiImages");

AI_LIST.forEach(ai => {
  const img = new Image();
  img.src = `${IMAGE_PATH}/s${promptNo}-${ai}.jpg`;

  img.onload = () => {
    const box = document.createElement("div");
    box.className = "ai-box";

    img.alt = ai;

    const span = document.createElement("span");
    span.textContent = ai;

    box.appendChild(img);
    box.appendChild(span);
    container.appendChild(box);
  };
});

/* 📋 COPY */
function copyText(id){
  const text = document.getElementById(id);
  text.select();
  navigator.clipboard.writeText(text.value);
  alert("คัดลอกเรียบร้อยแล้ว ✨");
}

/* 🚪 LOGOUT */
function logout(){
  if(confirm("ต้องการออกจากระบบหรือไม่?")){
    localStorage.removeItem("loggedIn");
    window.location.href = "index.html";
  }
}
</script>
