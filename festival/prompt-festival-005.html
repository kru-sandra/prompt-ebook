    <h3>Thai Prompt :</h3>
    <textarea id="thaiPrompt" rows="8">สร้างตัวละครการ์ตูน 3D Chibi คุณภาพสูงที่น่ารักมาก เป็นเด็กหญิงตัวน้อยในชุดแม่มดฮาโลวีน แสดงภาพเต็มตัว ยืนอยู่ตรงกลาง หันหน้าตรงมาทางผู้ชม พร้อมรอยยิ้มสดใสและอ้าปากยิ้มอย่างมีความสุข

ลักษณะตัวละคร:
เด็กหญิงสไตล์ Chibi ที่น่ารักเป็นพิเศษ มีศีรษะขนาดใหญ่โดดเด่น ลำตัวเล็ก แขนขาสั้นและมีสัดส่วนอวบกลมน่ารัก ดวงตากลมโตสีน้ำตาลช็อกโกแลตเป็นประกาย แก้มอิ่มสีชมพู จมูกเล็ก และรอยยิ้มแสนหวาน ผมยาว หนา ฟู มีวอลลุ่ม สีน้ำตาลดาร์กช็อกโกแลต เป็นลอนคลื่นสวยงาม มีหน้าม้าตรงนุ่ม ๆ ผมยาวสยายลงมาคลุมไหล่ทั้งสองข้าง เส้นผมเงางามและมีรายละเอียดลอนผมที่นุ่มเป็นธรรมชาติ

ชุดแม่มดฮาโลวีน:
สวมชุด Sweet Gothic Lolita สำหรับเทศกาลฮาโลวีนที่สวยงาม ในโทนสีส้มฟักทองสดใสและสีดำ
- หมวกแม่มดสีดำทรงแหลมขนาดใหญ่ ปีกหมวกกว้างและโค้งงอน ตกแต่งด้วยริบบิ้นผ้าซาตินสีส้มสดใสและโบว์สีส้มขนาดใหญ่
- เสื้อท่อนบนเข้ารูปทรงคอร์เซ็ตสีดำ ผูกเชือกไขว้ด้านหน้าด้วยริบบิ้นสีเหลืองทอง
- คอเสื้อทรง Sweetheart สีดำ ตกแต่งด้วยลูกไม้ลายดอกไม้ละเอียดอ่อน
- แขนเสื้อพองโปร่งแสงสีส้มฟักทอง ปลายแขนตกแต่งด้วยลูกไม้สีดำ
- กระโปรง Tutu สีส้มฟักทองหลายชั้น ฟูฟ่อง พร้อมระบายลูกไม้สีดำสวยงามตามชายกระโปรง
- มีลายใบหน้าฟักทอง Jack-o'-lantern สีดำสุดน่ารัก 2 ใบ พิมพ์อยู่ด้านหน้ากระโปรงสีส้ม
- ถุงมือยาวลูกไม้สีดำสง่างาม
- ถุงน่องลายตาข่ายสีดำ พร้อมรายละเอียดสายรัดถุงน่องลูกไม้ที่ประณีต
- รองเท้าส้นสูง Mary Jane สีดำสุดน่ารัก แต่งเติมด้วยสีส้มสดใส
- ต่างหูรูปฟักทองสีส้มขนาดเล็กน่ารัก
- สร้อยคอ Choker ลูกไม้สีดำสวยงาม

ท่าทาง:
ยืนโพสท่าน่ารักสดใสอย่างขี้เล่น แขนทั้งสองข้างกางออกเล็กน้อย ขาทั้งสองข้างไขว้กันอย่างนุ่มนวล สีหน้ามีความสุขและร่าเริง ต้องแสดงตัวละครให้เห็นครบทั้งตัว ตั้งแต่หมวกแม่มดจนถึงรองเท้า

ฉากหลัง:
ค่ำคืนฮาโลวีนอันแสนมหัศจรรย์ในหมู่บ้านแฟนตาซีสุดลึกลับ มีคฤหาสน์เก่าแก่สไตล์บ้านผีสิงพร้อมหน้าต่างเรืองแสงสีทอง มีฟักทองแกะสลักขนาดใหญ่เรืองแสงอยู่ทั้งสองข้าง มีของตกแต่งฮาโลวีนลอยอยู่ในอากาศ ใยแมงมุมสีดำ ธงสามเหลี่ยมสีส้มลวดลายค้างคาว พระจันทร์เต็มดวงขนาดใหญ่ส่องแสง ต้นไม้ลึกลับ และหมอกเวทมนตร์บางเบา

สไตล์งานภาพ 3D Chibi:
ตัวละคร 3D Chibi ที่น่ารักเป็นพิเศษ มีสัดส่วนแบบ Super Deformed ศีรษะใหญ่และลำตัวเล็ก ดวงตาโตเป็นประกายสื่ออารมณ์ ใบหน้ากลมน่ารัก แขนขาสั้นเรียว ผิวเนียนนุ่ม สไตล์ภาพยนตร์แอนิเมชัน 3D ระดับพรีเมียม ให้ความรู้สึกเหมือนตุ๊กตาสะสมดีไซเนอร์ รายละเอียดประณีตสวยงาม พื้นผิวผ้าเสมือนจริง กระโปรง Tulle ฟูฟ่อง รายละเอียดลูกไม้ซับซ้อน การเรนเดอร์ 3D เงางามสวยงาม แสงแบบภาพยนตร์ และโทนสีส้มสดใสตัดกับสีดำ

องค์ประกอบภาพ:
แสดงตัวละครเต็มตัว จัดวางไว้ตรงกลางภาพ ภาพแนวตั้งอัตราส่วน 9:16 รายละเอียดสูง ภาพประกอบการ์ตูน 3D ระดับมืออาชีพ พร้อมบรรยากาศฮาโลวีนที่เต็มไปด้วยมนตร์เสน่ห์

ข้อห้าม: ไม่ใช้มนุษย์เสมือนจริง ไม่ใช้สัดส่วนผู้ใหญ่แบบสมจริง ไม่มีตัวอักษร ไม่มีลายน้ำ และไม่มีโลโก้</textarea>

<script>
/* 🔢 GET PROMPT NUMBER FROM FILE NAME */
const match = location.pathname.match(/prompt-festival-(\d+)\.html/);
const promptNo = match ? match[1] : "000";

/* SET TITLE TEXT */
document.querySelector("#pageTitle .title-sub").textContent =
  `Prompt ${promptNo}`;
document.title = `เทศกาล | Prompt ${promptNo}`;

/* 🧠 AI LIST — ดึงชื่อเครื่องมือจากส่วนท้ายของชื่อไฟล์ */
const AI_LIST = [
  "dola",
  "gemini",
  "meta ai"
];

/* 📂 IMAGE PATH */
const IMAGE_PATH = "../images/festival";

/* 🖼 BUILD AI IMAGES (LOAD SAFE) */
const container = document.getElementById("aiImages");

AI_LIST.forEach(ai => {
  const img = new Image();
  img.src = `${IMAGE_PATH}/f${promptNo}-${ai}.webp`;

  img.onload = () => {
    const box = document.createElement("div");
    box.className = "ai-box";
    img.alt = ai;

    const span = document.createElement("span");
    span.textContent = ai;

    box.appendChild(img);
    box.appendChild(span);
    container.appendChild(box);
  };
});

/* 📋 COPY */
function copyText(id){
  const text = document.getElementById(id);
  text.select();
  navigator.clipboard.writeText(text.value);
  alert("คัดลอกเรียบร้อยแล้ว ✨");
}

/* 🚪 LOGOUT */
function logout(){
  if(confirm("ต้องการออกจากระบบหรือไม่?")){
    localStorage.removeItem("loggedIn");
    window.location.href = "index.html";
  }
}
</script>
