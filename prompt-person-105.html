    <textarea id="thaiPrompt" rows="8">
สร้างภาพ การ์ตูน ผู้หญิงสไตล์ 3Dชิบิ น่ารักมาก ตัวเล็ก หัวโต ตาโตเป็นประกาย สีตาน้ำตาลเข้ม ใบหน้าคล้ายตุ๊กตา ผิวขาวเนียนเหมือนพอร์ซเลน แก้มชมพูอมแดง จมูกเล็ก ปากเล็กสีชมพูอ่อน อารมณ์ใสซื่อ น่าทะนุถนอม

มีผิวขาวมากๆสว่างเหมือนหลอดไฟเน้นผิวฉ่ำวาวเรียบเนียน ดวงตากลมโต 
❤️ทรงผม :ผมสีน้ำตาลชานม หนา ยาวมากๆ เงางาม ถักเปียสองข้างหลวมไปฟูๆ ปอยผมเข้ากับกรอบหน้า เส้นผมโดนใบหน้าเล็กน้อยให้ดูเซ็กซี่ ทรงผมดูฟุ้งนุ่ม
🩷การแต่งหน้า : แต่งหน้าฉ่ำวาว ขนตางอน ปัดแก้มและปลายจมูกอมชมพูเล็กน้อย ใช้ไฮไลท์แต้มที่ปลายจมูกและสันจมูก เพื่อให้ดูจมูกเชิด - Aegyo-sal (ดอลลี่อาย): เน้นการเขียนขอบตาล่างให้ดูป่องออกมาด้วยอายแชโดว์สีสว่างและคอนทัวร์จางๆ ใต้ถุงตาเพื่อให้ตาดูโตและขี้อ้อน - อายไลเนอร์: กรีดเส้นบางๆ วิงหางออกไปทางด้านข้างเล็กน้อยเพื่อให้รูปตาดูยาวขึ้น ริมฝีปากแบบไล่สี (Gradient Lips) ใช้ลิปสติกโทนสีชมพูระเรื่อทาจากด้านในแล้วเบลอขอบปากให้ฟุ้งๆ ออกมาด้านนอก  ความฉ่ำวาว:ทับด้วยลิปกลอส (Lip Glaze) เพื่อให้ริมฝีปากดูอิ่มน้ำและสุขภาพดี ใส่คอนแทคเลนส์สีน้ำตาลอ่อนแบบตัดขอบจางๆ เพื่อให้ดวงตาดูซอฟต์และมีความเป็นธรรมชาติเข้ากับลุคการแต่งกาย
💛การแต่งกาย: ชุดถักโครเชต์สีครีมโทนอุ่น ผ้าไหมพรมถักแฮนด์เมด เสื้อครอปสายเดี่ยวติดกระดุมด้านหน้า คอเสื้อขอบหยัก ปักลายส้มและดอกไม้เล็กๆ อย่างประณีต กางเกงขาสั้นเอวสูงผ้าถักโครเชต์ สไตล์โบโฮผสมคอตเทจคอร์ โทนธรรมชาติ เนื้อผ้ามีเท็กซ์เจอร์ น่ารัก สดใส ดูงานแฮนด์เมดคุณภาพสูง
💙 เครื่องประดับ:นาฬิกา apple watch สี pink gold
💚พร๊อพ: กระบุงสะพายหลังใส่ส้ม
💜ท่าทาง:นั่งขอบราวสะพาน หัวเราะเบาๆ หันหน้ามองกล้อง น่ารักสดใส สะพายกระบุง

🩷สถานที่: สะพานไม้ สวนส้ม วิวภูเขา ท้องฟ้าสดใส 

🧡 ภาพถ่าย :ถ่ายแบบคุณภาพสูง Realistic photograph เลนส์กล้อง : F1.8 aperture เลนส์ 85 มม.ความละเอียดคมชัดสมจริง ด้วยแฟลชยิงตรง(Direct Flash) ภาพคมชัดสูง, โฟกัสที่คมชัด,ความละเอียดภาพคมชัดสมจริงสูงสุดขนาดภาพ 9:16
 </textarea>

<script>
/* 🔢 GET PROMPT NUMBER FROM FILE NAME */
const match = location.pathname.match(/prompt-person-(\d+)\.html/);
const promptNo = match ? match[1] : "000";

/* SET TITLE TEXT */
document.querySelector("#pageTitle .title-sub").textContent =
  `Prompt ${promptNo}`;
document.title = `หมวดบุคคล | Prompt ${promptNo}`;

/* 🧠 AI LIST */
const AI_LIST = [
  "gemini",
  "whisk",
  "meta",
  "copilot",
  "chatgpt",
  "leonardo",
  "raphaeal",
  "vheer",
  "kling",
  "bing",
  "dreamina",
  "manus ai",
  "flow ai"
];

/* 📂 IMAGE PATH */
const IMAGE_PATH = "images/person/person_prompt";

/* 🖼 BUILD AI IMAGES (LOAD SAFE) */
const container = document.getElementById("aiImages");

AI_LIST.forEach(ai => {
  const img = new Image();
  img.src = `${IMAGE_PATH}/p${promptNo}-${ai}.jpg`;

  img.onload = () => {
    const box = document.createElement("div");
    box.className = "ai-box";

    img.alt = ai;

    const span = document.createElement("span");
    span.textContent = ai;

    box.appendChild(img);
    box.appendChild(span);
    container.appendChild(box);
  };
});

/* 📋 COPY */
function copyText(id){
  const text = document.getElementById(id);
  text.select();
  navigator.clipboard.writeText(text.value);
  alert("คัดลอกเรียบร้อยแล้ว ✨");
}

/* 🚪 LOGOUT */
function logout(){
  if(confirm("ต้องการออกจากระบบหรือไม่?")){
    localStorage.removeItem("loggedIn");
    window.location.href = "index.html";
  }
}
</script>
