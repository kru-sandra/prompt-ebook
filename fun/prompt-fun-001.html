    <h3>Thai Prompt :</h3>
    <textarea id="thaiPrompt" rows="8">
สร้างภาพผู้หญิง ให้ใบหน้าเดิมตามไฟล์แนบ 100% ไม่เปลี่ยนแปลง 

ผิวขาวอมชมพูมาก เนียนใส

ผมยาวหนามากถึงเอว ลอนใหญ่เบาๆ เป็นธรรมชาติ มีวอลลุ่ม ผมสีน้ำตาลเข้มมีปอยผมเล็กน้อย ปล่อยผมปลิวปิดหน้าเล็กน้อย ไม่มีหน้าม้า

แต่งหน้า: การแต่งหน้า: สไตล์ K-Beauty Douyin ดวงตาสีน้ําตาลกลมโต ขนตายาวงอน บลัชออนสีชมพูทั่วแก้มและสันจมูก ริมฝีปากมันวาวสีชมพูไล่ระดับสีอวบอิ่มพร้อมผิวน้ํา   สีหน้าน่ารัก ขี้เล่นปนเซ็กซี่ ดูมีเสน่ห์


การแต่งกาย: 

เสื้อด้านบน

เสื้อครอปท็อปสีขาวงาช้าง / off-white ทรงเข้ารูปพอดีตัว ความยาวประมาณเหนือเอวเล็กน้อย เผยช่วงเอวและหน้าท้องเล็กน้อย

ตัวเสื้อเป็นผ้ายืดเนื้อนุ่มบางปานกลาง มี texture แบบ ruched / gathered fabric เป็นริ้วจีบแนวนอนละเอียดทั่วทั้งตัว ตั้งแต่ช่วงอกลงมาถึงชายเสื้อ ทำให้เนื้อผ้าดูมีมิติและแนบไปกับสรีระอย่างเป็นธรรมชาติ

ช่วงอกเป็นทรง square neckline / softly curved straight neckline เปิดช่วงไหปลาร้าและหัวไหล่เล็กน้อย แต่ยังดู elegant ไม่โป๊

สายเสื้อเป็นสายเล็กแบบ spaghetti straps แต่จุดเด่นคือสายทำจาก gold-tone chunky chain links ขนาดเล็กถึงปานกลาง เชื่อมต่อจากด้านหน้าไปด้านหลัง ให้ความรู้สึกเหมือนเครื่องประดับที่เป็นส่วนหนึ่งของเสื้อ

ช่วงอกและลำตัวเข้ารูปพอดี แต่ไม่รัดจนเกิดความผิดธรรมชาติ ชายเสื้อเป็นขอบตรงและหยุดบริเวณเอวเหนือขอบกางเกงเล็กน้อย

สีเสื้อเป็น warm ivory white / soft creamy white ไม่ใช่ขาวสว่างจัด เนื้อผ้าดู matte เล็กน้อย ไม่มันวาว และมี realistic fabric texture

2. กางเกงยีนส์

กางเกงยีนส์ high-waisted ultra wide-leg jeans เอวสูงมาก โดยขอบเอวอยู่บริเวณเอวธรรมชาติ

สีเป็น light vintage washed blue denim หรือสีฟ้าเดนิมฟอกอ่อน มีความแตกต่างของเฉดสีตามบริเวณที่เกิดการยับและการเสียดสี ให้ texture เหมือนผ้ายีนส์จริง

ทรงกางเกงกว้างตั้งแต่สะโพกลงไปจนถึงปลายขา เป็น very wide-leg / relaxed palazzo denim silhouette ไม่รัดต้นขา ไม่เข้ารูป และไม่ใช่ทรง skinny หรือ straight-leg

ช่วงสะโพกและเอวพอดีตัว มี waistband ที่ค่อนข้างชัดเจน พร้อม belt loops และกระดุมโลหะสีเงิน/เงินหม่น

ด้านหน้ามีรายละเอียดกางเกงยีนส์แบบคลาสสิก:

front button closure
zipper fly
belt loops
classic five-pocket construction
กระเป๋าหน้าทั้งสองข้าง
กระเป๋าหลังแบบเรียบง่าย
stitching สี denim/ทองอ่อนที่มองเห็นได้เล็กน้อย

เนื้อ denim ค่อนข้างมีน้ำหนักและอยู่ทรง แต่มีรอยยับธรรมชาติบริเวณเอว สะโพก หัวเข่า และข้อเท้า

ชายกางเกง ยาวมากจนเกือบคลุมรองเท้า และมี slight stacking / natural pooling บริเวณปลายขาเล็กน้อย ให้ลุค fashion-forward และขายาวเป็นพิเศษ

สถานที่:
คาเฟ่ริมถนนสไตล์ Parisian / European contemporary café มีหน้าต่างกระจกบานใหญ่ กรอบหน้าต่างสีดำหรือเข้ม ด้านหลังเป็นอาคารสถาปัตยกรรมยุโรปคลาสสิกผสมโมเดิร์น มีต้นไม้ริมถนน รถยนต์ และผู้คนในคาเฟ่เป็น background

มีโต๊ะกลมสีดำด้านอยู่ด้านหน้าภาพ พร้อมเก้าอี้หรือม้านั่งไม้สีธรรมชาติ บริเวณพื้นเป็นทางเท้าคอนกรีต/หินสีเทาอ่อน

พร็อพ:
แก้วเครื่องดื่มเย็นใสมีน้ำแข็งและหลอดสีเข้มวางอยู่ในมือหรือบนโต๊ะ ให้เห็นหยด condensation บนแก้วอย่างสมจริง
มีแว่นตากันแดดกรอบสีเข้มวางอยู่บนโต๊ะใกล้กระเป๋า

หญิงสาวนั่งโพสต์ท่าหน้าคาเฟ่  ถือสินค้า( ให้ AI วิเคราะห์ประเภทสินค้า จากข้อมูลในภาพที่ 2 ที่แนบไป)  โชว์ 

คาเฟ่มีดอกไม้ประดับสวยงาม 

ภาพถ่ายระยะใกล้ เห็น detail ชุดชัดเจน
Canon EOS R5, เลนส์ 85 มม. f/1.2, รูรับแสง f/1.2, DOF ตื้นพิเศษ, ผิวพอร์ซเลนเปล่งประกาย, สุนทรียศาสตร์แฟชั่นที่เน้นรายละเอียดอย่างพิถีพิถัน, อัตราส่วนภาพ 9:16–ไคฮเปอร์เรียลลิสม์
      
    </textarea>

  <!-- ENGLISH PROMPT -->
  <div class="prompt-box">
    <h3>English Prompt :</h3>
    <textarea id="engPrompt" rows="8">    
Create an image of a woman, keeping the exact same face as the attached reference image, 100% unchanged.

Very fair pinkish-white skin with a smooth, clear, luminous complexion.

Very long, extremely thick hair reaching the waist, with soft, large natural waves, voluminous and effortless. Dark brown hair with a few loose strands, slightly blowing across and partially covering the face. No bangs.

Makeup: K-Beauty Douyin style. Large, round brown eyes, long curled eyelashes, pink blush across the cheeks and the bridge of the nose, glossy pink gradient lips with a plump, juicy, hydrated finish. Facial expression is cute, playful, slightly sexy, and charming.


OUTFIT:

1. Top

A fitted ivory white / off-white crop top, with the length ending slightly above the waist, subtly revealing the waist and a small portion of the abdomen.

The top is made from soft, medium-thin stretch fabric with a ruched / gathered fabric texture, featuring fine horizontal pleats throughout the entire garment from the bust down to the hem. The textured fabric creates dimension and naturally conforms to the body.

The neckline is a square neckline / softly curved straight neckline, slightly exposing the collarbones and shoulders while remaining elegant and not revealing.

The straps are thin spaghetti straps, but the key feature is that they are made of small-to-medium gold-tone chunky chain links, connecting from the front to the back, creating the impression of jewelry integrated into the garment.

The bust and torso are fitted comfortably without being excessively tight or creating unnatural distortion. The hem is straight and ends slightly above the waistband of the jeans.

The top is warm ivory white / soft creamy white, not bright pure white. The fabric has a slightly matte finish, not glossy, with realistic fabric texture.


2. Jeans

High-waisted ultra-wide-leg jeans, with a very high waist positioned at the natural waistline.

Light vintage washed blue denim, with subtle variations in tone around areas of natural creasing and friction, creating a realistic authentic denim texture.

The jeans are extremely wide from the hips all the way down to the hem, featuring a very wide-leg / relaxed palazzo denim silhouette. They are not tight around the thighs, not fitted, and not skinny or straight-leg.

The waist and hips are fitted appropriately, with a clearly defined waistband, belt loops, and silver / brushed silver metal buttons.

The front features classic denim details:

- front button closure
- zipper fly
- belt loops
- classic five-pocket construction
- two front pockets
- simple back pockets
- subtly visible denim / light-gold stitching

The denim fabric is relatively substantial and structured while still showing natural wrinkles around the waist, hips, knees, and ankles.

The pant legs are extremely long, almost covering the shoes, with slight stacking / natural pooling around the hems, creating a fashion-forward look and making the legs appear exceptionally long.


LOCATION:

A Parisian / European contemporary street-side café with large glass windows and black or dark-colored window frames. The background features classic European architecture blended with modern elements, street-side trees, cars, and people inside the café as background elements.

A matte black round table is positioned in the foreground, accompanied by natural wood chairs or a wooden bench. The ground is a light gray concrete / stone sidewalk.

PROPS:

A clear glass of iced beverage with ice cubes and a dark-colored straw, held in her hand or placed on the table, with realistic condensation droplets visible on the glass.

A pair of dark-framed sunglasses placed on the table near the handbag.

The woman is sitting and posing in front of the café, holding a product. Have the AI analyze the type of product based on the information shown in the second attached image, and prominently showcase the product.

The café is decorated with beautiful floral arrangements.

Close-up photography with clearly visible outfit details.

Canon EOS R5, 85mm f/1.2 lens, f/1.2 aperture, extremely shallow depth of field, glowing porcelain-like skin, meticulously detailed high-fashion aesthetic, 9:16 aspect ratio, hyper-realism.
    </textarea>

<script>
/* 🔢 GET PROMPT NUMBER FROM FILE NAME */
const match = location.pathname.match(/prompt-sale-(\d+)\.html/);
const promptNo = match ? match[1] : "000";

/* SET TITLE TEXT */
document.querySelector("#pageTitle .title-sub").textContent =
  `Prompt ${promptNo}`;
document.title = `หมวดขายสินค้า | Prompt ${promptNo}`;

/* 🧠 AI LIST */
const AI_LIST = [
  "gemini",
  "whisk",
  "meta",
  "copilot",
  "chatgpt",
  "leonardo",
  "raphaeal",
  "vheer",
  "kling",
  "bing",
  "dreamina",
  "manus ai",
  "flow ai"
];

/* 📂 IMAGE PATH */
const IMAGE_PATH = "../images/sale";

/* 🖼 BUILD AI IMAGES (LOAD SAFE) */
const container = document.getElementById("aiImages");

AI_LIST.forEach(ai => {
  const img = new Image();
  img.src = `${IMAGE_PATH}/s${promptNo}-${ai}.jpg`;

  img.onload = () => {
    const box = document.createElement("div");
    box.className = "ai-box";

    img.alt = ai;

    const span = document.createElement("span");
    span.textContent = ai;

    box.appendChild(img);
    box.appendChild(span);
    container.appendChild(box);
  };
});

/* 📋 COPY */
function copyText(id){
  const text = document.getElementById(id);
  text.select();
  navigator.clipboard.writeText(text.value);
  alert("คัดลอกเรียบร้อยแล้ว ✨");
}

/* 🚪 LOGOUT */
function logout(){
  if(confirm("ต้องการออกจากระบบหรือไม่?")){
    localStorage.removeItem("loggedIn");
    window.location.href = "index.html";
  }
}
</script>
